<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Detection</title>
    <link rel="stylesheet" href="css/disease_detection.css">
</head>
<body>

    <header class="status-bar">
        <div class="status-left">
            <span class="battery-status">Battery: 90%</span>
        </div>
        <div class="status-center">
            <span class="scan-time">Last Scanned: 10:30am</span>
        </div>
        <div class="status-right">
            <span class="connection-status">Connection: Stable</span>
        </div>
    </header>

    <div class="back-container">
        <a href="dashboard.html" class="back-button">Back</a>
    </div>

    <main class="detection-content">
        <h2>Disease Detection</h2>
        
        <div class="detection-container">
            <div class="photo-box">
                Photo of the disease detected
                </div>

            <div class="content-box">
                Content of the disease (Symptoms, treatment, severity, etc.)
            </div>
        </div>
    </main>

</body>
</html>
